services:
  - type: web
    name: guardian-ai-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: BACKEND_CORS_ORIGINS
        value: '["*"]'
      - key: SECRET_KEY
        generateValue: true
