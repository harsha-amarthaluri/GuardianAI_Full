services:
  - type: web
    name: guardian-ai-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: BACKEND_CORS_ORIGINS
        value: '["*"]'
      - key: SECRET_KEY
        generateValue: true

  - type: cron
    name: guardian-ai-keepalive-cron
    runtime: python
    schedule: "*/14 * * * *"
    buildCommand: pip install requests
    startCommand: python scripts/ping_keepalive.py --once --url https://gai-backend-ylzf.onrender.com/health
